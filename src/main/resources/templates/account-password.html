<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Change password')}"></head>
<body class="bg-white text-gray-900">
<header th:replace="~{fragments :: nav}"></header>
<main class="mx-auto max-w-md px-4 py-8">
  <div th:replace="~{fragments :: flash}"></div>
  <h1 class="mb-1 text-xl font-semibold">Change password</h1>
  <p class="mb-5 text-sm text-gray-500" th:text="${me.email}">user@college</p>
  <form th:action="@{/account/password}" method="post" class="card space-y-4 p-6">
    <div><label class="label" for="current">Current password</label><input class="input" id="current" name="current" type="password" required autocomplete="current-password"></div>
    <div><label class="label" for="next">New password (min 8 characters)</label><input class="input" id="next" name="next" type="password" minlength="8" required autocomplete="new-password"></div>
    <div><label class="label" for="confirm">Confirm new password</label><input class="input" id="confirm" name="confirm" type="password" minlength="8" required autocomplete="new-password"></div>
    <button class="btn-primary" type="submit">Update password</button>
  </form>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
