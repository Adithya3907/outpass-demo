<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Audit log')}"></head>
<body class="bg-white text-gray-900">
<header th:replace="~{fragments :: nav}"></header>
<main class="mx-auto max-w-6xl px-4 py-6">
  <h1 class="mb-1 text-xl font-semibold">Audit log</h1>
  <p class="mb-4 text-sm text-gray-500">Append-only. The 300 most recent events.</p>
  <div class="card overflow-x-auto">
    <table class="tbl">
      <thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Entity</th><th>Details</th></tr></thead>
      <tbody class="divide-y divide-gray-100">
        <tr th:each="l : ${logs}">
          <td class="whitespace-nowrap" th:text="${@fmt.dt(l.createdAt)}">time</td>
          <td th:text="${l.actor}">actor</td>
          <td class="font-medium" th:text="${l.action}">action</td>
          <td th:text="${l.entity != null} ? ${l.entity + ' #' + l.entityId} : '-'">entity</td>
          <td th:text="${l.details}">details</td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
