<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Notice')}"></head>
<body class="bg-white text-gray-900">
<header th:replace="~{fragments :: nav}"></header>
<main class="mx-auto max-w-2xl px-4 py-16 text-center">
  <h1 class="text-2xl font-semibold" th:text="${title != null} ? ${title} : 'Something went wrong'">Something went wrong</h1>
  <p class="mt-3 text-gray-600" th:text="${message != null} ? ${message} : 'The page you asked for could not be shown.'">Message</p>
  <a class="btn-primary mt-8" th:href="@{/}">Back to home</a>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
