<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Students')}"></head>
<body class="bg-white text-gray-900">
<header th:replace="~{fragments :: nav}"></header>
<main class="mx-auto max-w-5xl px-4 py-6">
  <h1 class="text-xl font-semibold">Student search</h1>
  <p class="mb-4 text-sm text-gray-500">All departments</p>
  <form method="get" th:action="@{/head/students}" class="mb-5 flex gap-2">
    <input class="input" name="q" th:value="${q}" placeholder="Search by name or roll number" autofocus>
    <button class="btn-primary" type="submit">Search</button>
    <a class="btn-outline shrink-0" th:href="@{/export/students.csv(q=${q})}">Download CSV</a>
  </form>
  <div class="card overflow-x-auto">
    <table class="tbl">
      <thead><tr><th>Student</th><th>Roll number</th><th>Class</th><th></th></tr></thead>
      <tbody class="divide-y divide-gray-100">
        <tr th:each="s : ${results}">
          <td><div class="flex items-center gap-3"><div th:replace="~{fragments :: avatar(${s.user.fullName}, ${s.rollNumber}, 32)}"></div><span class="font-medium" th:text="${s.user.fullName}">Name</span></div></td>
          <td th:text="${s.rollNumber}">roll</td>
          <td th:text="${s.classSection.label}">class</td>
          <td class="text-right"><a class="font-medium text-brand underline" th:href="@{/head/students/{id}(id=${s.id})}">Full history</a></td>
        </tr>
        <tr th:if="${#lists.isEmpty(results)}"><td colspan="4" class="py-8 text-center text-gray-500">No students found.</td></tr>
      </tbody>
    </table>
  </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
